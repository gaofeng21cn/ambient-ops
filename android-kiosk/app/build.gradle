plugins {
    id "com.android.application"
}

android {
    namespace "cn.gaofeng.ambientops.kiosk"
    compileSdk 35

    defaultConfig {
        applicationId "cn.gaofeng.ambientops.kiosk"
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}
