name: Docker

on:
  pull_request:
    paths:
      - ".github/workflows/docker.yaml"
      - ".dockerignore"
      - "Dockerfile"
      - "compose*.yaml"
      - "ops/docker/**"
      - "package*.json"
      - "public/**"
      - "server/**"
      - "src/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/docker.yaml"
      - ".dockerignore"
      - "Dockerfile"
      - "compose*.yaml"
      - "ops/docker/**"
      - "package*.json"
      - "public/**"
      - "server/**"
      - "src/**"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: ./ops/docker/smoke-test.sh
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
