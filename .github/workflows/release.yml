name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: ./ops/docker/smoke-test.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Qualify unsigned Android release code
        run: |
          ./android-kiosk/gradlew \
            -p android-kiosk \
            :app:testReleaseUnsignedUnitTest \
            :app:assembleReleaseUnsigned

  docker:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release version
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish multi-platform image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.value }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
          build-args: |
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.version.outputs.value }}
          provenance: mode=max
          sbom: true

  android:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Require Android release signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.AMBIENT_OPS_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.AMBIENT_OPS_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AMBIENT_OPS_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AMBIENT_OPS_ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          for value in "$KEYSTORE_B64" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            test -n "$value" || {
              echo "A required Android release signing secret is missing." >&2
              exit 1
            }
          done
      - name: Restore Android signing key
        env:
          KEYSTORE_B64: ${{ secrets.AMBIENT_OPS_ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/ambient-ops-release.p12"
      - name: Build signed Android release
        env:
          AMBIENT_OPS_ANDROID_KEYSTORE: ${{ runner.temp }}/ambient-ops-release.p12
          AMBIENT_OPS_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.AMBIENT_OPS_ANDROID_KEYSTORE_PASSWORD }}
          AMBIENT_OPS_ANDROID_KEY_ALIAS: ${{ secrets.AMBIENT_OPS_ANDROID_KEY_ALIAS }}
          AMBIENT_OPS_ANDROID_KEY_PASSWORD: ${{ secrets.AMBIENT_OPS_ANDROID_KEY_PASSWORD }}
        run: |
          ./android-kiosk/gradlew \
            -p android-kiosk \
            :app:testReleaseUnitTest \
            :app:assembleRelease
      - name: Verify and package signed APK
        id: apk
        env:
          EXPECTED_CERT_SHA256: 4e5f5732645986e5a861446028846fcfb571b9dd006d87da19aa60f152639206
        shell: bash
        run: |
          apk="android-kiosk/app/build/outputs/apk/release/app-release.apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          "$apksigner" verify --verbose --print-certs "$apk"
          actual_cert="$("$apksigner" verify --print-certs "$apk" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -n 1)"
          test "$actual_cert" = "$EXPECTED_CERT_SHA256" || {
            echo "Android signing certificate does not match the established upgrade key." >&2
            exit 1
          }
          version_name="$(sed -n 's/.*versionName[[:space:]]*"\([^"]*\)".*/\1/p' android-kiosk/app/build.gradle)"
          artifact="Ambient-Ops-Kiosk-${version_name}.apk"
          cp "$apk" "$artifact"
          sha256sum "$artifact" > "${artifact}.sha256"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ambient-ops-android-release
          path: |
            ${{ steps.apk.outputs.artifact }}
            ${{ steps.apk.outputs.artifact }}.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    needs: [docker, android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ambient-ops-android-release
          path: release-assets
      - name: Record immutable Docker image
        env:
          IMAGE_DIGEST: ${{ needs.docker.outputs.digest }}
          IMAGE_VERSION: ${{ needs.docker.outputs.version }}
        shell: bash
        run: |
          printf '%s\n' \
            "ghcr.io/${GITHUB_REPOSITORY}:${IMAGE_VERSION}" \
            "ghcr.io/${GITHUB_REPOSITORY}@${IMAGE_DIGEST}" \
            > "release-assets/Ambient-Ops-Docker-${IMAGE_VERSION}.txt"
          sha256sum release-assets/* > release-assets/SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Ambient Ops $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
