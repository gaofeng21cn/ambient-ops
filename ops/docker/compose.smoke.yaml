services:
  gateway:
    image: ${OPL_FLEET_COCKPIT_SMOKE_IMAGE:-opl-fleet-cockpit:smoke}
    network_mode: bridge
    ports: !override
      - "127.0.0.1::8787"
    environment:
      DEMO_MODE: "false"
      DISCOVERY_ENABLED: "false"
      LIVE_AFTER_SECONDS: "3600"
      STALE_AFTER_SECONDS: "7200"
    volumes: !override
      - cockpit_data:/data
      - ${AMBIENT_OPS_SMOKE_SECRETS_DIR:?set AMBIENT_OPS_SMOKE_SECRETS_DIR}:/run/secrets:ro
