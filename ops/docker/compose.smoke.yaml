services:
  ambient-ops:
    image: ${AMBIENT_OPS_SMOKE_IMAGE:-ambient-ops:smoke}
    network_mode: bridge
    ports: !override
      - "127.0.0.1::8787"
    environment:
      DEMO_MODE: "false"
      DISCOVERY_ENABLED: "false"
      LIVE_AFTER_SECONDS: "3600"
      STALE_AFTER_SECONDS: "7200"
    volumes: !override
      - ambient_ops_data:/data
      - ${AMBIENT_OPS_SMOKE_SECRETS_DIR:?set AMBIENT_OPS_SMOKE_SECRETS_DIR}:/run/secrets:ro
